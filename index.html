<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flipkart Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">Flipkart <span>Store</span></div>
    <input class="search" placeholder="Search for products, brands and more" />
    <button class="login">Login</button>
  </header>

  <section class="hero">
    <div>
      <p class="pill">Big Savings Days</p>
      <h1>Up to 80% OFF on Top Deals</h1>
      <p class="sub">Limited-time sale on electronics, fashion, and home essentials.</p>
      <div class="countdown" id="countdown"></div>
      <button class="cta">Shop Now</button>
    </div>
  </section>

  <main>
    <section>
      <h2>Featured Categories</h2>
      <div class="categories" id="categories"></div>
    </section>

    <section>
      <h2>Best of Electronics</h2>
      <div class="grid" id="products"></div>
    </section>
  </main>

  <footer>
    <p>© 2026 Flipkart Store Clone. Built for educational/demo use.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
